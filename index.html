<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>淘比海的小游戏</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #0d0d1a; color: #f2f2f7; min-height: 100vh; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 48px 20px; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  p.sub { color: #9a9aad; margin: 0 0 32px; }
  .card { display: block; background: #1a1a2e; border: 1px solid #2c2c44; border-radius: 16px; padding: 22px; margin-bottom: 16px; color: inherit; text-decoration: none; }
  .card:hover { border-color: #6c6cf5; }
  .card h2 { font-size: 20px; margin: 0 0 6px; }
  .card p { margin: 0; color: #b9b9cc; font-size: 15px; line-height: 1.6; }
  .tag { display: inline-block; margin-top: 12px; font-size: 13px; color: #8f8ff0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>淘比海的小游戏</h1>
  <p class="sub">点开就能玩，不用下载。</p>
  <a class="card" href="/dewdrop/">
    <h2>🌸 露珠花园 Dewdrop Garden</h2>
    <p>带一颗露珠穿过 8 座花园：旋转重力，收集星光，抵达花朵。手机和电脑都能玩。</p>
    <span class="tag">解谜 · 8 关 →</span>
  </a>
  <a class="card" href="/port-solano/">
    <h2>🚗 Port Solano</h2>
    <p>俯视 2D 开放世界犯罪游戏：开车、偷车、甩掉警察，完成 3 个剧情任务。</p>
    <span class="tag">开放世界 · 3 个任务 →</span>
  </a>
</div>
</body>
</html>
