<script>
'use strict';
let LANG = 'en';
function L(en, zh) { return LANG === 'zh' ? zh : en; }
/* ============================================================
   Port Solano — top-down open-world crime game.
   The original multi-file ES-module source (game/src/*.js from
   the make.fun gta6-01 entry) inlined into one classic script:
   imports/exports removed, modules concatenated in dependency
   order. Save data is kept in memory for this session only.
   ============================================================ */

// ---------- random.js ----------
function createRandom(seed) {
  let a = seed >>> 0;
  return {
    next() {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    },
    int(min, max) {
      return min + Math.floor(this.next() * (max - min + 1));
    },
    pick(list) {
      return list[Math.floor(this.next() * list.length)];
    },
  };
}

// ---------- city.js ----------
const WORLD_W = 3200;
const WORLD_H = 2400;
const ROAD_W = 96;

const BUILDING_COLORS = ['#8a6f5c', '#7d8aa0', '#a08a6a', '#6f7d6a', '#96705a', '#5f6f8a', '#a07a72', '#77876f'];
const ROOF_COLORS = ['#5c4a3e', '#4a5568', '#6b5a48', '#47543f', '#6e4f3f', '#414e61'];

function buildCity(rng) {
  const vRoads = [];
  for (let x = 320; x < WORLD_W; x += 400) vRoads.push(x);
  const hRoads = [];
  for (let y = 320; y < WORLD_H; y += 400) hRoads.push(y);

  const buildings = [];
  for (let bi = 0; bi < vRoads.length - 1; bi += 1) {
    for (let bj = 0; bj < hRoads.length - 1; bj += 1) {
      const x0 = vRoads[bi] + ROAD_W / 2 + 14;
      const y0 = hRoads[bj] + ROAD_W / 2 + 14;
      const x1 = vRoads[bi + 1] - ROAD_W / 2 - 14;
      const y1 = hRoads[bj + 1] - ROAD_W / 2 - 14;
      if (rng.next() < 0.2) {
        buildings.push({ x: x0, y: y0, w: x1 - x0, h: y1 - y0, park: true, color: '#3f7a44', roof: '#2f5c33' });
        continue;
      }
      const cols = rng.int(1, 2);
      const rows = rng.int(1, 2);
      const cw = (x1 - x0) / cols;
      const ch = (y1 - y0) / rows;
      for (let c = 0; c < cols; c += 1) {
        for (let r = 0; r < rows; r += 1) {
          const w = cw * (0.72 + rng.next() * 0.2);
          const h = ch * (0.72 + rng.next() * 0.2);
          const x = x0 + c * cw + (cw - w) / 2;
          const y = y0 + r * ch + (ch - h) / 2;
          buildings.push({
            x, y, w, h, park: false,
            color: BUILDING_COLORS[rng.int(0, BUILDING_COLORS.length - 1)],
            roof: ROOF_COLORS[rng.int(0, ROOF_COLORS.length - 1)],
            windows: rng.int(2, 5),
          });
        }
      }
    }
  }

  const places = {
    garage: { x: vRoads[1], y: hRoads[4], labelEn: 'Rosa’s Garage', labelZh: '罗莎的车库' },
    bank: { x: vRoads[5], y: hRoads[1], labelEn: 'Solano Bank', labelZh: '索拉诺银行' },
    hideout: { x: vRoads[1], y: hRoads[1], labelEn: 'Hideout', labelZh: '藏身处' },
    docks: { x: vRoads[6], y: hRoads[4], labelEn: 'Docks', labelZh: '码头' },
    carMeet: { x: vRoads[3], y: hRoads[2], labelEn: 'Car Meet', labelZh: '车友会' },
  };
  return { vRoads, hRoads, buildings, places };
}

function hitsBuilding(city, x, y, margin = 0) {
  for (const b of city.buildings) {
    if (b.park) continue;
    if (x > b.x - margin && x < b.x + b.w + margin && y > b.y - margin && y < b.y + b.h + margin) return b;
  }
  return null;
}

function resolveBuildingCollision(city, body, radius) {
  const b = hitsBuilding(city, body.x, body.y, radius);
  if (!b) return false;
  const cx = Math.max(b.x, Math.min(body.x, b.x + b.w));
  const cy = Math.max(b.y, Math.min(body.y, b.y + b.h));
  let dx = body.x - cx;
  let dy = body.y - cy;
  const d = Math.hypot(dx, dy);
  if (d === 0) {
    const left = body.x - b.x;
    const right = b.x + b.w - body.x;
    const top = body.y - b.y;
    const bottom = b.y + b.h - body.y;
    const m = Math.min(left, right, top, bottom);
    if (m === left) body.x = b.x - radius;
    else if (m === right) body.x = b.x + b.w + radius;
    else if (m === top) body.y = b.y - radius;
    else body.y = b.y + b.h + radius;
    return true;
  }
  dx /= d;
  dy /= d;
  body.x = cx + dx * radius;
  body.y = cy + dy * radius;
  return true;
}

function nearestRoadPoint(city, x, y) {
  let best = null;
  let bestD = Infinity;
  for (const rx of city.vRoads) {
    const d = Math.abs(x - rx);
    if (d < bestD) { bestD = d; best = { x: rx, y, axis: 'v' }; }
  }
  for (const ry of city.hRoads) {
    const d = Math.abs(y - ry);
    if (d < bestD) { bestD = d; best = { x, y: ry, axis: 'h' }; }
  }
  return best;
}

// ---------- audio.js ----------
function createAudio() {
  let ctx = null;
  let master = null;
  let engineOsc = null;
  let engineGain = null;
  let sirenOsc = null;
  let sirenGain = null;
  let sirenLfo = null;
  let muted = false;

  function ensure() {
    if (ctx) {
      if (ctx.state === 'suspended') ctx.resume();
      return true;
    }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.35;
      master.connect(ctx.destination);
      engineOsc = ctx.createOscillator();
      engineOsc.type = 'sawtooth';
      engineOsc.frequency.value = 50;
      engineGain = ctx.createGain();
      engineGain.gain.value = 0;
      const engineFilter = ctx.createBiquadFilter();
      engineFilter.type = 'lowpass';
      engineFilter.frequency.value = 400;
      engineOsc.connect(engineFilter);
      engineFilter.connect(engineGain);
      engineGain.connect(master);
      engineOsc.start();
      sirenOsc = ctx.createOscillator();
      sirenOsc.type = 'sine';
      sirenOsc.frequency.value = 700;
      sirenLfo = ctx.createOscillator();
      sirenLfo.type = 'square';
      sirenLfo.frequency.value = 0.8;
      const lfoGain = ctx.createGain();
      lfoGain.gain.value = 180;
      sirenLfo.connect(lfoGain);
      lfoGain.connect(sirenOsc.frequency);
      sirenGain = ctx.createGain();
      sirenGain.gain.value = 0;
      sirenOsc.connect(sirenGain);
      sirenGain.connect(master);
      sirenOsc.start();
      sirenLfo.start();
    } catch {
      ctx = null;
      return false;
    }
    return true;
  }

  function blip(freq, dur, type = 'square', vol = 0.2, slideTo = 0) {
    if (!ensure() || muted) return;
    const t = ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(g);
    g.connect(master);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }

  function noiseBurst(dur, vol = 0.3, lowpass = 1200) {
    if (!ensure() || muted) return;
    const t = ctx.currentTime;
    const len = Math.floor(ctx.sampleRate * dur);
    const buffer = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < len; i += 1) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = lowpass;
    const g = ctx.createGain();
    g.gain.value = vol;
    src.connect(filter);
    filter.connect(g);
    g.connect(master);
    src.start(t);
  }

  return {
    unlock() { ensure(); },
    get muted() { return muted; },
    toggleMute() {
      muted = !muted;
      if (master) master.gain.value = muted ? 0 : 0.35;
      return muted;
    },
    engine(speed01, driving) {
      if (!ctx || muted) return;
      engineGain.gain.setTargetAtTime(driving ? 0.05 + speed01 * 0.06 : 0, ctx.currentTime, 0.1);
      engineOsc.frequency.setTargetAtTime(50 + speed01 * 130, ctx.currentTime, 0.1);
    },
    siren(on) {
      if (!ctx || muted) return;
      sirenGain.gain.setTargetAtTime(on ? 0.045 : 0, ctx.currentTime, 0.3);
    },
    shoot() { noiseBurst(0.12, 0.35, 2500); blip(160, 0.08, 'square', 0.15, 60); },
    punch() { noiseBurst(0.08, 0.25, 700); },
    crash() { noiseBurst(0.25, 0.4, 500); },
    pickup() { blip(660, 0.09, 'sine', 0.2); blip(990, 0.12, 'sine', 0.2); },
    missionDone() {
      blip(523, 0.12, 'sine', 0.22);
      setTimeout(() => blip(659, 0.12, 'sine', 0.22), 120);
      setTimeout(() => blip(784, 0.2, 'sine', 0.22), 240);
    },
    busted() { blip(220, 0.5, 'sawtooth', 0.2, 110); },
    click() { blip(880, 0.05, 'sine', 0.15); },
    wantedUp() { blip(440, 0.15, 'square', 0.18, 880); },
    reload() { blip(300, 0.06, 'square', 0.15); setTimeout(() => blip(420, 0.06, 'square', 0.15), 90); },
  };
}

// ---------- input.js (keyboard + mouse + touch buttons) ----------
const ACTION_CONFIRM = 1;
const ACTION_PAUSE = 2;
const ACTION_ENTER_CAR = 4;
const ACTION_SHOOT = 8;
const ACTION_PUNCH = 16;
const ACTION_RELOAD = 32;
const ACTION_MUTE = 64;

function createInput(canvas) {
  const keys = new Set();
  const touch = { up: false, down: false, left: false, right: false, punch: false };
  let actions = 0;
  const mouse = { x: 0, y: 0, down: false, clicked: false, clickX: 0, clickY: 0 };

  function keyName(event) {
    return event.key.length === 1 ? event.key.toLowerCase() : event.key;
  }

  window.addEventListener('keydown', (event) => {
    const k = keyName(event);
    if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) event.preventDefault();
    if (event.repeat) return;
    keys.add(k);
    if (k === 'Enter' || k === ' ') actions |= ACTION_CONFIRM;
    if (k === 'Escape' || k === 'p' || k === 'P') actions |= ACTION_PAUSE;
    if (k === 'e' || k === 'E') actions |= ACTION_ENTER_CAR;
    if (k === 'f' || k === 'F') actions |= ACTION_SHOOT;
    if (k === 'r' || k === 'R') actions |= ACTION_RELOAD;
    if (k === 'm' || k === 'M') actions |= ACTION_MUTE;
  });
  window.addEventListener('keyup', (event) => keys.delete(keyName(event)));
  window.addEventListener('blur', () => keys.clear());

  canvas.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = event.clientX - rect.left;
    mouse.y = event.clientY - rect.top;
  });
  canvas.addEventListener('mousedown', (event) => {
    mouse.down = true;
    mouse.clicked = true;
    mouse.clickX = event.clientX - canvas.getBoundingClientRect().left;
    mouse.clickY = event.clientY - canvas.getBoundingClientRect().top;
    if (event.button === 0) actions |= ACTION_SHOOT;
  });
  window.addEventListener('mouseup', () => { mouse.down = false; });

  // Touching the canvas aims at the touch point; a tap also counts as a
  // click (start / confirm) and a shot, mirroring the mouse behaviour.
  function canvasTouch(event) {
    const t = event.changedTouches[0];
    if (!t) return;
    const rect = canvas.getBoundingClientRect();
    mouse.x = t.clientX - rect.left;
    mouse.y = t.clientY - rect.top;
    if (event.type === 'touchstart') {
      mouse.down = true;
      mouse.clicked = true;
      mouse.clickX = mouse.x;
      mouse.clickY = mouse.y;
      actions |= ACTION_SHOOT;
    }
    if (event.type === 'touchend') mouse.down = false;
  }
  canvas.addEventListener('touchstart', canvasTouch, { passive: true });
  canvas.addEventListener('touchmove', canvasTouch, { passive: true });
  canvas.addEventListener('touchend', canvasTouch, { passive: true });

  return {
    mouse,
    held(code) { return keys.has(code); },
    drive() {
      const left = (keys.has('a') || keys.has('ArrowLeft') || touch.left) ? 1 : 0;
      const right = (keys.has('d') || keys.has('ArrowRight') || touch.right) ? 1 : 0;
      const up = (keys.has('w') || keys.has('ArrowUp') || touch.up) ? 1 : 0;
      const down = (keys.has('s') || keys.has('ArrowDown') || touch.down) ? 1 : 0;
      return { steer: right - left, throttle: up - down, punch: keys.has(' ') || touch.punch };
    },
    takeActions() {
      const taken = actions;
      actions = 0;
      return taken;
    },
    takeClick() {
      if (!mouse.clicked) return null;
      mouse.clicked = false;
      return { x: mouse.clickX, y: mouse.clickY };
    },
    // Hooks for the on-screen touch buttons.
    touchDir(name, on) { if (name in touch) touch[name] = !!on; },
    pressAction(bit) { actions |= bit; },
  };
}

function wdist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function wclamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function createWorld(rng, audio) {
  const city = buildCity(rng);
  let nextCarId = 1;

  const state = {
    city,
    time: 0,
    clock: 9 * 60,
    money: 50,
    health: 100,
    ammo: 12,
    wanted: 0,
    lastCrime: -999,
    lastWantedDrop: 0,
    missionIndex: 0,
    missionStage: 0,
    missionActive: true,
    missionText: '',
    message: '',
    messageTimer: 0,
    player: { x: 700, y: 700, angle: 0, speed: 0, car: null, punchCooldown: 0, reloadTimer: 0 },
    cars: [],
    peds: [],
    cops: [],
    thugs: [],
    pickups: [],
    bullets: [],
    particles: [],
    camera: { x: 700, y: 700 },
    stats: { stolen: 0, crimes: 0, missionsDone: 0 },
    over: null,
  };

  function announce(text, seconds = 3) {
    state.message = text;
    state.messageTimer = seconds;
  }

  function addWanted(n) {
    const before = state.wanted;
    state.wanted = wclamp(state.wanted + n, 0, 5);
    state.lastCrime = state.time;
    if (state.wanted > before) {
      state.stats.crimes += 1;
      audio.wantedUp();
      announce(LANG === 'zh' ? `通缉等级 ${state.wanted} —— 警察来了！` : `Wanted level ${state.wanted} — the police are coming!`, 2.5);
    }
  }

  function spawnCar(x, y, angle, spec, driver) {
    const car = {
      id: nextCarId += 1, x, y, angle, speed: 0,
      len: spec.len, wid: spec.wid, color: spec.color, type: spec.type,
      topSpeed: spec.speed, driver: driver || 'ai',
      axis: Math.abs(Math.sin(angle)) > Math.abs(Math.cos(angle)) ? 'v' : 'h',
      dir: 1, lane: 22, turnCooldown: 0, hp: 100,
    };
    state.cars.push(car);
    return car;
  }

  function spawnTrafficCar() {
    const vertical = rng.next() < 0.5;
    const road = vertical
      ? city.vRoads[rng.int(0, city.vRoads.length - 1)]
      : city.hRoads[rng.int(0, city.hRoads.length - 1)];
    const along = rng.next() * (vertical ? WORLD_H : WORLD_W);
    const spec = CAR_TYPES[rng.int(0, CAR_TYPES.length - 1)];
    const angle = vertical ? (rng.next() < 0.5 ? Math.PI / 2 : -Math.PI / 2) : (rng.next() < 0.5 ? 0 : Math.PI);
    const car = spawnCar(vertical ? road + (rng.next() < 0.5 ? -22 : 22) : along, vertical ? along : road + (rng.next() < 0.5 ? -22 : 22), angle, spec, 'ai');
    car.speed = car.topSpeed * 0.35;
    car.axis = vertical ? 'v' : 'h';
    car.dir = vertical ? (angle > 0 ? 1 : -1) : (angle === 0 ? 1 : -1);
    return car;
  }

  function spawnParkedCar() {
    const road = city.vRoads[rng.int(0, city.vRoads.length - 1)];
    const y = city.hRoads[rng.int(0, city.hRoads.length - 1)] + rng.int(-160, 160);
    const spec = CAR_TYPES[rng.int(0, CAR_TYPES.length - 1)];
    const car = spawnCar(road + ROAD_W / 2 + 16, wclamp(y, 60, WORLD_H - 60), Math.PI / 2, spec, 'none');
    return car;
  }

  function spawnPed() {
    const x = rng.next() * WORLD_W;
    const y = rng.next() * WORLD_H;
    if (hitsBuilding(city, x, y, 12)) return null;
    const ped = {
      x, y, angle: rng.next() * Math.PI * 2, speed: 28 + rng.next() * 22,
      state: 'walk', color: PED_COLORS[rng.int(0, PED_COLORS.length - 1)],
      dirTimer: 2 + rng.next() * 4, fleeTimer: 0, dead: false,
    };
    state.peds.push(ped);
    return ped;
  }

  function spawnPickup(x, y, kind) {
    state.pickups.push({ x, y, kind, bob: rng.next() * 6 });
  }

  function burst(x, y, color, n, speed = 120) {
    for (let i = 0; i < n; i += 1) {
      const a = rng.next() * Math.PI * 2;
      const s = speed * (0.3 + rng.next() * 0.7);
      state.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + rng.next() * 0.4, color, size: 2 + rng.next() * 3 });
    }
  }

  function missionTarget() {
    const p = city.places;
    const i = state.missionIndex;
    if (i === 0) return state.missionStage === 0 ? p.carMeet : p.garage;
    if (i === 1) return p.docks;
    if (i === 2) return state.missionStage === 0 ? p.bank : state.missionStage === 1 ? p.bank : p.hideout;
    return p.hideout;
  }

  function missionObjective() {
    const i = state.missionIndex;
    if (i === 0) return state.missionStage === 0 ? L('Go to the car meet and steal the gold sportscar', '去车友会偷金色跑车') : L('Deliver the sportscar to Rosa’s Garage', '把跑车送到罗莎的车库');
    if (i === 1) return state.missionStage === 0 ? L('Go to the Docks', '去码头') : (LANG === 'zh' ? `干掉码头帮（还剩 ${state.thugs.filter((t) => !t.dead).length} 人）` : `Take out the Dock Rats (${state.thugs.filter((t) => !t.dead).length} left)`);
    if (i === 2) {
      if (state.missionStage === 0) return L('Go to Solano Bank', '去索拉诺银行');
      if (state.missionStage === 1) return L('Grab the cash bag — then run!', '抢走现金袋——快跑！');
      return L('Lose the heat and reach the Hideout', '甩掉警察，回到藏身处');
    }
    return L('All missions complete — free roam. Have fun, Port Solano is yours.', '所有任务完成——自由探索。这座城市是你的了，尽情玩吧。');
  }

  function startMissionStage() {
    const i = state.missionIndex;
    if (i === 1 && state.missionStage === 1 && state.thugs.length === 0) {
      const d = city.places.docks;
      for (let k = 0; k < 4; k += 1) {
        state.thugs.push({
          x: d.x + (k - 1.5) * 70, y: d.y + (k % 2 === 0 ? -60 : 60),
          angle: 0, speed: 60, hp: 100, dead: false, shootTimer: 1 + k * 0.5, color: '#c0392b',
        });
      }
      announce(L('The Dock Rats are here — take them all out!', '码头帮来了——把他们全干掉！'), 3);
    }
    if (i === 2 && state.missionStage === 1) {
      spawnPickup(city.places.bank.x + 40, city.places.bank.y + 40, 'cashbag');
      announce(L('Grab the cash bag!', '抢走现金袋！'), 3);
    }
  }

  function completeMission() {
    const reward = [300, 500, 1200][state.missionIndex] || 0;
    state.money += reward;
    state.stats.missionsDone += 1;
    audio.missionDone();
    announce(LANG === 'zh' ? `任务完成！+$${reward}` : `Mission complete! +$${reward}`, 4);
    state.missionIndex += 1;
    state.missionStage = 0;
    state.thugs = [];
    state.pickups = state.pickups.filter((p) => p.kind !== 'cashbag');
    if (state.missionIndex < MISSIONS.length) {
      announce(LANG === 'zh' ? `新任务：${MISSIONS[state.missionIndex].name} —— ${MISSIONS[state.missionIndex].brief}` : `New mission: ${MISSIONS[state.missionIndex].name} — ${MISSIONS[state.missionIndex].brief}`, 5);
    } else {
      announce(L('Story complete! Port Solano is yours — free roam.', '主线完成！索拉诺港是你的了——自由探索。'), 5);
    }
  }

  function reset() {
    state.time = 0;
    state.clock = 9 * 60;
    state.money = 50;
    state.health = 100;
    state.ammo = 12;
    state.wanted = 0;
    state.lastCrime = -999;
    state.missionIndex = 0;
    state.missionStage = 0;
    state.missionActive = true;
    state.cars = [];
    state.peds = [];
    state.cops = [];
    state.thugs = [];
    state.pickups = [];
    state.bullets = [];
    state.particles = [];
    state.over = null;
    state.stats = { stolen: 0, crimes: 0, missionsDone: 0 };
    state.player = { x: 700, y: 700, angle: 0, speed: 0, car: null, punchCooldown: 0, reloadTimer: 0 };
    state.camera = { x: 700, y: 700 };
    const meet = city.places.carMeet;
    const gold = spawnCar(meet.x + 30, meet.y + 30, 0, { type: 'sport', len: 54, wid: 26, speed: 580, color: '#d4af37' }, 'none');
    gold.targetCar = true;
    for (let i = 0; i < 12; i += 1) spawnTrafficCar();
    for (let i = 0; i < 8; i += 1) spawnParkedCar();
    for (let i = 0; i < 26; i += 1) spawnPed();
    spawnPickup(900, 500, 'health');
    spawnPickup(1500, 1300, 'ammo');
    spawnPickup(2100, 900, 'ammo');
    spawnPickup(500, 1700, 'health');
    announce(LANG === 'zh' ? `任务 1：${MISSIONS[0].name} —— ${MISSIONS[0].brief}` : `Mission 1: ${MISSIONS[0].name} — ${MISSIONS[0].brief}`, 6);
  }

  function nearestCar(x, y, maxD) {
    let best = null;
    let bestD = maxD;
    for (const car of state.cars) {
      const d = wdist(car, { x, y });
      if (d < bestD) { bestD = d; best = car; }
    }
    return best;
  }

  function enterCar(car) {
    if (!car || car.driver === 'player') return;
    const wasParked = car.driver === 'none';
    const wasTraffic = car.driver === 'ai';
    car.driver = 'player';
    state.player.car = car;
    state.player.speed = 0;
    if (wasParked || wasTraffic) {
      state.stats.stolen += 1;
      addWanted(1);
      announce(wasTraffic ? L('Carjacked! The driver ran off.', '抢车成功！司机跑了。') : L('Stole a parked car!', '偷了一辆停着的车！'), 2.5);
    }
    if (car.targetCar && state.missionIndex === 0 && state.missionStage === 0) {
      state.missionStage = 1;
      announce(L('Got the gold sportscar! Now deliver it to Rosa’s Garage.', '拿到金色跑车了！现在送到罗莎的车库。'), 4);
    }
  }

  function exitCar() {
    const car = state.player.car;
    if (!car) return;
    car.driver = 'none';
    car.speed = 0;
    const a = car.angle + Math.PI / 2;
    state.player.x = car.x + Math.cos(a) * 40;
    state.player.y = car.y + Math.sin(a) * 40;
    state.player.angle = car.angle;
    state.player.car = null;
    resolveBuildingCollision(city, state.player, 14);
  }

  function shootAt(fromX, fromY, targetX, targetY, from) {
    if (state.ammo <= 0) {
      announce(L('Out of ammo — find an ammo pickup (green box).', '没子弹了——找弹药补给（绿盒子）。'), 2);
      audio.click();
      return;
    }
    state.ammo -= 1;
    const a = Math.atan2(targetY - fromY, targetX - fromX);
    const speed = 900;
    state.bullets.push({ x: fromX + Math.cos(a) * 20, y: fromY + Math.sin(a) * 20, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, life: 0.8, from });
    burst(fromX + Math.cos(a) * 24, fromY + Math.sin(a) * 24, '#f1c40f', 4, 90);
    audio.shoot();
  }

  function punch() {
    const p = state.player;
    if (p.punchCooldown > 0) return;
    p.punchCooldown = 0.4;
    audio.punch();
    const reach = 46;
    const hx = p.x + Math.cos(p.angle) * reach;
    const hy = p.y + Math.sin(p.angle) * reach;
    let hitSomething = false;
    for (const ped of state.peds) {
      if (!ped.dead && Math.hypot(ped.x - hx, ped.y - hy) < 34) {
        ped.dead = true;
        burst(ped.x, ped.y, '#e74c3c', 10);
        addWanted(1);
        hitSomething = true;
      }
    }
    for (const thug of state.thugs) {
      if (!thug.dead && Math.hypot(thug.x - hx, thug.y - hy) < 36) {
        thug.hp -= 30;
        burst(thug.x, thug.y, '#e74c3c', 8);
        if (thug.hp <= 0) { thug.dead = true; burst(thug.x, thug.y, '#c0392b', 14); }
        hitSomething = true;
      }
    }
    for (const cop of state.cops) {
      if (Math.hypot(cop.x - hx, cop.y - hy) < 36) {
        cop.hp -= 30;
        burst(cop.x, cop.y, '#3498db', 8);
        if (cop.hp <= 0) cop.down = true;
        addWanted(1);
        hitSomething = true;
      }
    }
    if (!hitSomething) burst(hx, hy, '#ffffff', 3, 50);
  }

  function updatePlayer(dt, drive, actions, mouseWorld) {
    const p = state.player;
    p.punchCooldown = Math.max(0, p.punchCooldown - dt);
    if (p.reloadTimer > 0) {
      p.reloadTimer -= dt;
      if (p.reloadTimer <= 0) { state.ammo = 12; audio.reload(); }
    }
    if (actions & ACTION_RELOAD && state.ammo < 12 && p.reloadTimer <= 0) {
      p.reloadTimer = 0.8;
      announce(L('Reloading…', '正在换弹…'), 1);
    }
    if (p.car) {
      const car = p.car;
      const accel = 520;
      const maxReverse = 180;
      if (drive.throttle > 0) car.speed += accel * dt;
      else if (drive.throttle < 0) car.speed -= (car.speed > 5 ? 700 : 300) * dt;
      else car.speed -= Math.sign(car.speed) * 160 * dt;
      if (Math.abs(car.speed) < 4 && drive.throttle === 0) car.speed = 0;
      car.speed = wclamp(car.speed, -maxReverse, car.topSpeed);
      const steerAmount = drive.steer * 2.1 * dt * (car.speed >= 0 ? 1 : -1) * Math.min(1, Math.abs(car.speed) / 120 + 0.25);
      car.angle += steerAmount * Math.sign(car.speed || 1);
      car.x += Math.cos(car.angle) * car.speed * dt;
      car.y += Math.sin(car.angle) * car.speed * dt;
      car.x = wclamp(car.x, 30, WORLD_W - 30);
      car.y = wclamp(car.y, 30, WORLD_H - 30);
      p.x = car.x;
      p.y = car.y;
      p.angle = car.angle;
      if (Math.abs(car.speed) > 40 && rng.next() < dt * 8) {
        state.particles.push({ x: car.x - Math.cos(car.angle) * car.len / 2, y: car.y - Math.sin(car.angle) * car.len / 2, vx: 0, vy: 0, life: 0.35, color: '#999999', size: 3 });
      }
      if (resolveBuildingCollision(city, car, car.len / 2)) {
        if (Math.abs(car.speed) > 200) { audio.crash(); burst(car.x, car.y, '#f39c12', 8); }
        car.speed *= -0.25;
      }
      for (const ped of state.peds) {
        if (!ped.dead && Math.hypot(ped.x - car.x, ped.y - car.y) < 26 && Math.abs(car.speed) > 60) {
          ped.dead = true;
          burst(ped.x, ped.y, '#e74c3c', 12);
          audio.crash();
          addWanted(1);
          announce(L('You ran someone over!', '你撞到人了！'), 2);
        }
      }
      if (actions & ACTION_ENTER_CAR) exitCar();
    } else {
      const speed = 175;
      let vx = 0;
      let vy = 0;
      if (drive.throttle > 0) vy -= 1;
      if (drive.throttle < 0) vy += 1;
      if (drive.steer > 0) vx += 1;
      if (drive.steer < 0) vx -= 1;
      const len = Math.hypot(vx, vy);
      if (len > 0) {
        vx /= len; vy /= len;
        p.x += vx * speed * dt;
        p.y += vy * speed * dt;
        p.angle = Math.atan2(vy, vx);
        p.speed = speed;
      } else {
        p.speed = 0;
      }
      if (mouseWorld && Math.hypot(mouseWorld.x - p.x, mouseWorld.y - p.y) > 60) {
        p.angle = Math.atan2(mouseWorld.y - p.y, mouseWorld.x - p.x);
      }
      p.x = wclamp(p.x, 20, WORLD_W - 20);
      p.y = wclamp(p.y, 20, WORLD_H - 20);
      resolveBuildingCollision(city, p, 14);
      if (actions & ACTION_ENTER_CAR) {
        const car = nearestCar(p.x, p.y, 70);
        if (car) enterCar(car);
      }
      if (actions & ACTION_PUNCH || drive.punch) punch();
    }
    if (actions & ACTION_SHOOT && !p.car && p.reloadTimer <= 0) {
      shootAt(p.x, p.y, mouseWorld ? mouseWorld.x : p.x + Math.cos(p.angle) * 100, mouseWorld ? mouseWorld.y : p.y + Math.sin(p.angle) * 100, 'player');
    }
  }

  function updateTraffic(dt) {
    for (const car of state.cars) {
      if (car.driver !== 'ai') continue;
      car.turnCooldown -= dt;
      const onV = city.vRoads.some((rx) => Math.abs(car.x - rx) < 30);
      const onH = city.hRoads.some((ry) => Math.abs(car.y - ry) < 30);
      if (car.axis === 'v' && onV && onH && car.turnCooldown <= 0 && rng.next() < dt * 0.6) {
        car.axis = 'h';
        car.dir = rng.next() < 0.5 ? 1 : -1;
        car.angle = car.dir > 0 ? 0 : Math.PI;
        car.turnCooldown = 4;
      } else if (car.axis === 'h' && onV && onH && car.turnCooldown <= 0 && rng.next() < dt * 0.6) {
        car.axis = 'v';
        car.dir = rng.next() < 0.5 ? 1 : -1;
        car.angle = car.dir > 0 ? Math.PI / 2 : -Math.PI / 2;
        car.turnCooldown = 4;
      }
      let targetSpeed = car.topSpeed * 0.38;
      for (const other of state.cars) {
        if (other === car || other.driver === 'none') continue;
        const dx = other.x - car.x;
        const dy = other.y - car.y;
        const ahead = car.axis === 'v' ? dy * car.dir : dx * car.dir;
        const lateral = car.axis === 'v' ? Math.abs(dx) : Math.abs(dy);
        if (ahead > 0 && ahead < 90 && lateral < 30) { targetSpeed = 0; break; }
      }
      car.speed += (targetSpeed - car.speed) * Math.min(1, dt * 1.5);
      car.x += Math.cos(car.angle) * car.speed * dt;
      car.y += Math.sin(car.angle) * car.speed * dt;
      if (car.x < 20 || car.x > WORLD_W - 20 || car.y < 20 || car.y > WORLD_H - 20) {
        car.dir *= -1;
        car.angle += Math.PI;
        car.x = wclamp(car.x, 30, WORLD_W - 30);
        car.y = wclamp(car.y, 30, WORLD_H - 30);
      }
      if (car.axis === 'v') {
        const road = city.vRoads.reduce((a, b) => (Math.abs(b - car.x) < Math.abs(a - car.x) ? b : a));
        car.x += (road + car.lane * (car.dir > 0 ? 1 : -1) * 0.5 - car.x) * Math.min(1, dt * 0.8);
      } else {
        const road = city.hRoads.reduce((a, b) => (Math.abs(b - car.y) < Math.abs(a - car.y) ? b : a));
        car.y += (road + car.lane * (car.dir > 0 ? 1 : -1) * 0.5 - car.y) * Math.min(1, dt * 0.8);
      }
    }
  }

  function updatePeds(dt) {
    const p = state.player;
    for (const ped of state.peds) {
      if (ped.dead) continue;
      const dPlayer = Math.hypot(ped.x - p.x, ped.y - p.y);
      const carSpeed = p.car ? Math.abs(p.car.speed) : 0;
      if ((dPlayer < 130 && (carSpeed > 120 || state.wanted > 0)) || ped.fleeTimer > 0) {
        ped.state = 'flee';
        ped.fleeTimer = 1.2;
        ped.angle = Math.atan2(ped.y - p.y, ped.x - p.x);
        ped.x += Math.cos(ped.angle) * 150 * dt;
        ped.y += Math.sin(ped.angle) * 150 * dt;
      } else {
        ped.state = 'walk';
        ped.dirTimer -= dt;
        if (ped.dirTimer <= 0) {
          ped.dirTimer = 2 + rng.next() * 4;
          ped.angle = rng.next() * Math.PI * 2;
        }
        ped.x += Math.cos(ped.angle) * ped.speed * dt;
        ped.y += Math.sin(ped.angle) * ped.speed * dt;
      }
      ped.fleeTimer = Math.max(0, ped.fleeTimer - dt);
      ped.x = wclamp(ped.x, 20, WORLD_W - 20);
      ped.y = wclamp(ped.y, 20, WORLD_H - 20);
      resolveBuildingCollision(city, ped, 10);
    }
  }

  function updatePolice(dt) {
    const p = state.player;
    const wantCars = state.wanted > 0 ? Math.min(state.wanted, 3) : 0;
    const wantCops = state.wanted > 0 ? Math.min(state.wanted * 2, 6) : 0;
    const policeCars = state.cars.filter((c) => c.type === 'police');
    if (policeCars.length < wantCars && rng.next() < dt * 1.2) {
      const a = rng.next() * Math.PI * 2;
      const x = wclamp(p.x + Math.cos(a) * 550, 60, WORLD_W - 60);
      const y = wclamp(p.y + Math.sin(a) * 550, 60, WORLD_H - 60);
      const car = spawnCar(x, y, Math.atan2(p.y - y, p.x - x), { type: 'police', len: 54, wid: 26, speed: 520, color: '#1a1a2e' }, 'police');
      car.speed = 200;
    }
    const liveCops = state.cops.filter((c) => !c.down);
    if (liveCops.length < wantCops && rng.next() < dt * 1.5) {
      const a = rng.next() * Math.PI * 2;
      state.cops.push({
        x: wclamp(p.x + Math.cos(a) * 420, 40, WORLD_W - 40),
        y: wclamp(p.y + Math.sin(a) * 420, 40, WORLD_H - 40),
        angle: 0, hp: 100, down: false, punchCooldown: 0, touchTime: 0,
      });
    }
    for (const car of policeCars) {
      if (car.driver === 'player') continue;
      const a = Math.atan2(p.y - car.y, p.x - car.x);
      let da = a - car.angle;
      while (da > Math.PI) da -= Math.PI * 2;
      while (da < -Math.PI) da += Math.PI * 2;
      car.angle += wclamp(da, -2.4 * dt, 2.4 * dt);
      car.speed = Math.min(car.speed + 300 * dt, car.topSpeed);
      car.x += Math.cos(car.angle) * car.speed * dt;
      car.y += Math.sin(car.angle) * car.speed * dt;
      car.x = wclamp(car.x, 30, WORLD_W - 30);
      car.y = wclamp(car.y, 30, WORLD_H - 30);
      if (resolveBuildingCollision(city, car, car.len / 2)) car.speed *= 0.4;
      const d = Math.hypot(car.x - p.x, car.y - p.y);
      if (d < 46) {
        if (p.car) {
          p.car.speed *= 0.6;
          if (car.speed > 150) { audio.crash(); burst(p.x, p.y, '#f39c12', 8); }
          car.speed *= -0.2;
        } else if (car.speed > 80) {
          state.health -= 12 * dt * 10;
          burst(p.x, p.y, '#e74c3c', 6);
        }
      }
    }
    for (const cop of state.cops) {
      if (cop.down) continue;
      cop.punchCooldown -= dt;
      const d = Math.hypot(cop.x - p.x, cop.y - p.y);
      cop.angle = Math.atan2(p.y - cop.y, p.x - cop.x);
      if (d > 30) {
        const speed = p.car ? 0 : 165;
        if (p.car) {
          cop.x += Math.cos(cop.angle) * 90 * dt;
          cop.y += Math.sin(cop.angle) * 90 * dt;
        } else {
          cop.x += Math.cos(cop.angle) * speed * dt;
          cop.y += Math.sin(cop.angle) * speed * dt;
        }
        cop.touchTime = 0;
      } else if (!p.car) {
        cop.touchTime += dt;
        if (cop.punchCooldown <= 0) {
          cop.punchCooldown = 0.9;
          state.health -= 9;
          burst(p.x, p.y, '#e74c3c', 6);
          audio.punch();
          announce(L('A cop is beating you down!', '警察正在揍你，快跑！'), 1.5);
        }
        if (cop.touchTime > 1.6) {
          state.over = 'busted';
          audio.busted();
          return;
        }
      }
      resolveBuildingCollision(city, cop, 12);
    }
    if (state.wanted === 0) {
      state.cars = state.cars.filter((c) => c.type !== 'police' || c.driver === 'player' || Math.hypot(c.x - p.x, c.y - p.y) < 900);
      state.cops = state.cops.filter((c) => !c.down && Math.hypot(c.x - p.x, c.y - p.y) < 900);
    }
    audio.siren(state.wanted > 0);
  }

  function updateThugs(dt) {
    const p = state.player;
    for (const thug of state.thugs) {
      if (thug.dead) continue;
      const d = Math.hypot(thug.x - p.x, thug.y - p.y);
      thug.angle = Math.atan2(p.y - thug.y, p.x - thug.x);
      thug.shootTimer -= dt;
      if (d > 260) {
        thug.x += Math.cos(thug.angle) * thug.speed * dt;
        thug.y += Math.sin(thug.angle) * thug.speed * dt;
      } else if (thug.shootTimer <= 0) {
        thug.shootTimer = 1.4 + rng.next() * 0.8;
        const a = thug.angle + (rng.next() - 0.5) * 0.3;
        state.bullets.push({ x: thug.x, y: thug.y, vx: Math.cos(a) * 620, vy: Math.sin(a) * 620, life: 1.1, from: 'thug' });
        audio.shoot();
      }
      resolveBuildingCollision(city, thug, 12);
    }
  }

  function updateBullets(dt) {
    const p = state.player;
    for (const b of state.bullets) {
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;
      if (hitsBuilding(city, b.x, b.y, 0)) {
        b.life = 0;
        burst(b.x, b.y, '#cccccc', 4, 60);
      }
      if (b.from === 'player') {
        for (const ped of state.peds) {
          if (!ped.dead && Math.hypot(ped.x - b.x, ped.y - b.y) < 16) {
            ped.dead = true;
            b.life = 0;
            burst(ped.x, ped.y, '#e74c3c', 10);
            addWanted(1);
          }
        }
        for (const thug of state.thugs) {
          if (!thug.dead && Math.hypot(thug.x - b.x, thug.y - b.y) < 18) {
            thug.hp -= 34;
            b.life = 0;
            burst(thug.x, thug.y, '#e74c3c', 8);
            if (thug.hp <= 0) { thug.dead = true; burst(thug.x, thug.y, '#c0392b', 14); state.money += 20; announce(L('Dock Rat down! +$20', '干掉一个码头帮！+$20'), 1.5); }
          }
        }
        for (const cop of state.cops) {
          if (!cop.down && Math.hypot(cop.x - b.x, cop.y - b.y) < 16) {
            cop.hp -= 34;
            b.life = 0;
            burst(cop.x, cop.y, '#3498db', 8);
            addWanted(1);
            if (cop.hp <= 0) cop.down = true;
          }
        }
        for (const car of state.cars) {
          if (car.driver !== 'player' && Math.hypot(car.x - b.x, car.y - b.y) < 30) {
            b.life = 0;
            burst(b.x, b.y, '#f39c12', 5, 60);
          }
        }
      } else if (Math.hypot(p.x - b.x, p.y - b.y) < (p.car ? 26 : 14)) {
        b.life = 0;
        state.health -= 8;
        burst(p.x, p.y, '#e74c3c', 6);
      }
    }
    state.bullets = state.bullets.filter((b) => b.life > 0);
  }

  function updatePickups(dt) {
    const p = state.player;
    for (const pk of state.pickups) {
      pk.bob += dt;
      if (Math.hypot(pk.x - p.x, pk.y - p.y) < 34) {
        if (pk.kind === 'health') { state.health = Math.min(100, state.health + 40); announce(L('Health +40', '生命值 +40'), 2); }
        if (pk.kind === 'ammo') { state.ammo = 12; announce(L('Ammo refilled', '弹药已补满'), 2); }
        if (pk.kind === 'cashbag') {
          announce(L('Got the cash! Now reach the Hideout — the cops are coming!', '拿到现金了！现在回藏身处——警察来了！'), 4);
          state.missionStage = 2;
          addWanted(3);
        }
        audio.pickup();
        pk.taken = true;
      }
    }
    state.pickups = state.pickups.filter((pk) => !pk.taken);
  }

  function updateMission(dt) {
    if (state.missionIndex >= MISSIONS.length) return;
    const target = missionTarget();
    const p = state.player;
    const d = Math.hypot(target.x - p.x, target.y - p.y);
    const i = state.missionIndex;
    if (i === 0) {
      if (state.missionStage === 0 && p.car && p.car.targetCar) state.missionStage = 1;
      else if (state.missionStage === 1 && d < 80 && p.car && p.car.targetCar) completeMission();
    } else if (i === 1) {
      if (state.missionStage === 0 && d < 120) {
        state.missionStage = 1;
        startMissionStage();
      } else if (state.missionStage === 1 && state.thugs.length > 0 && state.thugs.every((t) => t.dead)) {
        completeMission();
      }
    } else if (i === 2) {
      if (state.missionStage === 0 && d < 120) {
        state.missionStage = 1;
        startMissionStage();
      } else if (state.missionStage === 2 && d < 90) {
        completeMission();
      }
    }
  }

  function step(dt, drive, actions, mouseWorld) {
    if (state.over) return 0;
    state.time += dt;
    state.clock += dt * 0.5;
    if (state.clock >= 24 * 60) state.clock -= 24 * 60;
    if (state.messageTimer > 0) state.messageTimer -= dt;
    if (state.wanted === 0 && state.health < 100) state.health = Math.min(100, state.health + 3 * dt);
    if (state.wanted > 0 && state.time - state.lastCrime > 18) {
      const nearCop = state.cops.some((c) => !c.down && Math.hypot(c.x - state.player.x, c.y - state.player.y) < 500)
        || state.cars.some((c) => c.type === 'police' && Math.hypot(c.x - state.player.x, c.y - state.player.y) < 500);
      if (!nearCop && state.time - state.lastWantedDrop > 12) {
        state.wanted -= 1;
        state.lastWantedDrop = state.time;
        if (state.wanted === 0) announce(L('You lost the cops. Heat is off.', '你甩掉警察了，通缉解除。'), 3);
      }
    }
    updatePlayer(dt, drive, actions, mouseWorld);
    updateTraffic(dt);
    updatePeds(dt);
    updatePolice(dt);
    if (state.over) return EVENT_BUSTED;
    updateThugs(dt);
    updateBullets(dt);
    updatePickups(dt);
    updateMission(dt);
    for (const pt of state.particles) {
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.life -= dt;
    }
    state.particles = state.particles.filter((pt) => pt.life > 0);
    state.camera.x = wclamp(state.player.x, 0, WORLD_W);
    state.camera.y = wclamp(state.player.y, 0, WORLD_H);
    const driving = !!state.player.car;
    audio.engine(driving ? Math.abs(state.player.car.speed) / state.player.car.topSpeed : 0, driving);
    if (state.health <= 0) {
      state.over = 'wasted';
      audio.busted();
      return EVENT_WASTED;
    }
    return 0;
  }

  function serialize() {
    return {
      money: state.money, health: state.health, ammo: state.ammo, wanted: state.wanted,
      missionIndex: state.missionIndex, missionStage: state.missionStage,
      x: state.player.x, y: state.player.y, clock: state.clock, time: state.time,
      stats: state.stats,
    };
  }

  function restore(data) {
    if (!data) return false;
    reset();
    state.money = data.money ?? 50;
    state.health = data.health ?? 100;
    state.ammo = data.ammo ?? 12;
    state.wanted = data.wanted ?? 0;
    state.missionIndex = data.missionIndex ?? 0;
    state.missionStage = data.missionStage ?? 0;
    state.player.x = wclamp(data.x ?? 700, 20, WORLD_W - 20);
    state.player.y = wclamp(data.y ?? 700, 20, WORLD_H - 20);
    state.clock = data.clock ?? 9 * 60;
    state.time = data.time ?? 0;
    if (data.stats) state.stats = data.stats;
    state.camera.x = state.player.x;
    state.camera.y = state.player.y;
    return true;
  }

  reset();
  return {
    state, reset, step, missionTarget, missionObjective, serialize, restore,
    announce, addWanted,
    save() {
      try { savedGameJson = JSON.stringify(serialize()); return true; } catch { return false; }
    },
    load() {
      try { return savedGameJson ? restore(JSON.parse(savedGameJson)) : false; } catch { return false; }
    },
    hasSave() { return !!savedGameJson; },
  };
}

// ---------- render.js ----------
const SCREEN_TITLE = 'title';
const SCREEN_PLAY = 'play';
const SCREEN_PAUSED = 'paused';
const SCREEN_OVER = 'over';

function drawCar(ctx, car) {
  ctx.save();
  ctx.translate(car.x, car.y);
  ctx.rotate(car.angle);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(-car.len / 2 + 3, -car.wid / 2 + 3, car.len, car.wid);
  ctx.fillStyle = '#111111';
  const wl = car.len * 0.28;
  const ww = 5;
  ctx.fillRect(-wl, -car.wid / 2 - 2, 12, ww);
  ctx.fillRect(-wl, car.wid / 2 - 3, 12, ww);
  ctx.fillRect(wl - 6, -car.wid / 2 - 2, 12, ww);
  ctx.fillRect(wl - 6, car.wid / 2 - 3, 12, ww);
  ctx.fillStyle = car.color;
  roundRect(ctx, -car.len / 2, -car.wid / 2, car.len, car.wid, 7);
  ctx.fill();
  ctx.fillStyle = '#bfe3ea';
  ctx.fillRect(car.len * 0.12, -car.wid / 2 + 4, car.len * 0.16, car.wid - 8);
  ctx.fillRect(-car.len * 0.32, -car.wid / 2 + 4, car.len * 0.1, car.wid - 8);
  ctx.fillStyle = '#fff8c0';
  ctx.fillRect(car.len / 2 - 2, -car.wid / 2 + 3, 3, 5);
  ctx.fillRect(car.len / 2 - 2, car.wid / 2 - 8, 3, 5);
  if (car.type === 'taxi') {
    ctx.fillStyle = '#111111';
    ctx.fillRect(-8, -car.wid / 2 + 2, 16, 6);
    ctx.fillStyle = '#f1c40f';
    ctx.font = 'bold 8px sans-serif';
    ctx.fillText('TAXI', -10, 3);
  }
  if (car.type === 'police') {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-car.len * 0.18, -car.wid / 2 + 2, car.len * 0.36, car.wid - 4);
    ctx.fillStyle = '#111111';
    ctx.font = 'bold 9px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(L('POLICE', '警察'), 0, 3);
    ctx.fillStyle = '#ff0000';
    ctx.fillRect(-6, -car.wid / 2 - 1, 5, 4);
    ctx.fillStyle = '#0044ff';
    ctx.fillRect(1, -car.wid / 2 - 1, 5, 4);
  }
  if (car.targetCar) {
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('★', 0, -car.wid / 2 - 6);
  }
  ctx.restore();
}

function drawPerson(ctx, x, y, angle, color, opts = {}) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(2, 3, 9, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(0, 0, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#f1c27d';
  ctx.beginPath();
  ctx.arc(3, 0, 4.5, 0, Math.PI * 2);
  ctx.fill();
  if (opts.gun) {
    ctx.fillStyle = '#222222';
    ctx.fillRect(4, -2, 12, 3);
  }
  if (opts.cop) {
    ctx.fillStyle = '#1a1a2e';
    ctx.beginPath();
    ctx.arc(0, 0, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffd700';
    ctx.fillRect(-2, -8, 4, 3);
    ctx.fillStyle = '#f1c27d';
    ctx.beginPath();
    ctx.arc(3, 0, 4.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function formatClock(minutes) {
  const h = Math.floor(minutes / 60) % 24;
  const m = Math.floor(minutes % 60);
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}

function createRenderer(canvas) {
  const ctx = canvas.getContext('2d');
  let viewW = 0;
  let viewH = 0;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    viewW = window.innerWidth;
    viewH = window.innerHeight;
    canvas.width = Math.floor(viewW * dpr);
    canvas.height = Math.floor(viewH * dpr);
    canvas.style.width = `${viewW}px`;
    canvas.style.height = `${viewH}px`;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function drawWorld(state, now) {
    const cam = state.camera;
    const vx = rclamp(cam.x - viewW / 2, 0, Math.max(0, WORLD_W - viewW));
    const vy = rclamp(cam.y - viewH / 2, 0, Math.max(0, WORLD_H - viewH));
    const ox = (viewW > WORLD_W ? (viewW - WORLD_W) / 2 : -vx);
    const oy = (viewH > WORLD_H ? (viewH - WORLD_H) / 2 : -vy);

    ctx.fillStyle = '#2e4a2f';
    ctx.fillRect(0, 0, viewW, viewH);
    ctx.save();
    ctx.translate(ox, oy);

    const city = state.city;
    ctx.fillStyle = '#4a7a44';
    ctx.fillRect(0, 0, WORLD_W, WORLD_H);
    ctx.fillStyle = '#3a3a40';
    for (const rx of city.vRoads) ctx.fillRect(rx - ROAD_W / 2, 0, ROAD_W, WORLD_H);
    for (const ry of city.hRoads) ctx.fillRect(0, ry - ROAD_W / 2, WORLD_W, ROAD_W);
    ctx.strokeStyle = '#e8e8a0';
    ctx.lineWidth = 3;
    ctx.setLineDash([18, 22]);
    ctx.beginPath();
    for (const rx of city.vRoads) { ctx.moveTo(rx, 0); ctx.lineTo(rx, WORLD_H); }
    for (const ry of city.hRoads) { ctx.moveTo(0, ry); ctx.lineTo(WORLD_W, ry); }
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = '#9a9a92';
    ctx.lineWidth = 6;
    ctx.beginPath();
    for (const rx of city.vRoads) {
      ctx.moveTo(rx - ROAD_W / 2 - 3, 0); ctx.lineTo(rx - ROAD_W / 2 - 3, WORLD_H);
      ctx.moveTo(rx + ROAD_W / 2 + 3, 0); ctx.lineTo(rx + ROAD_W / 2 + 3, WORLD_H);
    }
    for (const ry of city.hRoads) {
      ctx.moveTo(0, ry - ROAD_W / 2 - 3); ctx.lineTo(WORLD_W, ry - ROAD_W / 2 - 3);
      ctx.moveTo(0, ry + ROAD_W / 2 + 3); ctx.lineTo(WORLD_W, ry + ROAD_W / 2 + 3);
    }
    ctx.stroke();

    for (const b of city.buildings) {
      if (b.park) {
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = '#2f6b34';
        for (let i = 0; i < 5; i += 1) {
          const tx = b.x + 20 + ((i * 53) % Math.max(40, b.w - 40));
          const ty = b.y + 24 + ((i * 37) % Math.max(40, b.h - 40));
          ctx.beginPath(); ctx.arc(tx, ty, 12, 0, Math.PI * 2); ctx.fill();
        }
        continue;
      }
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(b.x + 4, b.y + 4, b.w, b.h);
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = b.roof;
      ctx.fillRect(b.x + 6, b.y + 6, b.w - 12, b.h - 12);
      ctx.fillStyle = '#ffe9a0';
      const cols = Math.max(1, Math.floor(b.w / 34));
      const rows = Math.max(1, Math.floor(b.h / 34));
      for (let i = 0; i < cols; i += 1) {
        for (let j = 0; j < rows; j += 1) {
          if ((i * 7 + j * 13 + b.windows) % 3 === 0) {
            ctx.fillRect(b.x + 12 + i * 34, b.y + 12 + j * 34, 12, 10);
          }
        }
      }
    }

    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    for (const key of Object.keys(city.places)) {
      const pl = city.places[key];
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillText(L(pl.labelEn, pl.labelZh), pl.x, pl.y - ROAD_W / 2 - 8);
    }

    if (state.missionIndex < MISSIONS.length) {
      const t = worldMarker(state);
      const pulse = 1 + Math.sin(now / 300) * 0.15;
      ctx.save();
      ctx.translate(t.x, t.y);
      ctx.scale(pulse, pulse);
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.moveTo(0, -26); ctx.lineTo(16, 0); ctx.lineTo(0, 26); ctx.lineTo(-16, 0);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#111111';
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText('!', 0, 6);
      ctx.restore();
    }

    for (const pk of state.pickups) {
      const bob = Math.sin(pk.bob * 2) * 3;
      ctx.save();
      ctx.translate(pk.x, pk.y + bob);
      if (pk.kind === 'health') {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-11, -11, 22, 22);
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(-3, -8, 6, 16);
        ctx.fillRect(-8, -3, 16, 6);
      } else if (pk.kind === 'ammo') {
        ctx.fillStyle = '#27ae60';
        ctx.fillRect(-11, -8, 22, 16);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 10px sans-serif';
        ctx.fillText(L('AMMO', '弹药'), 0, 4);
      } else if (pk.kind === 'cashbag') {
        ctx.fillStyle = '#2ecc71';
        ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 14px sans-serif';
        ctx.fillText('$', 0, 5);
      }
      ctx.restore();
    }

    for (const ped of state.peds) {
      if (ped.dead) {
        ctx.save();
        ctx.translate(ped.x, ped.y);
        ctx.rotate(ped.angle);
        ctx.fillStyle = ped.color;
        ctx.fillRect(-10, -4, 20, 8);
        ctx.fillStyle = '#f1c27d';
        ctx.beginPath(); ctx.arc(12, 0, 4, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        continue;
      }
      const wobble = ped.state === 'flee' ? Math.sin(now / 60) * 2 : 0;
      drawPerson(ctx, ped.x + wobble, ped.y, ped.angle, ped.color);
    }
    for (const thug of state.thugs) {
      if (thug.dead) continue;
      drawPerson(ctx, thug.x, thug.y, thug.angle, thug.color, { gun: true });
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(thug.x - 14, thug.y - 20, 28, 4);
      ctx.fillStyle = '#44ff44';
      ctx.fillRect(thug.x - 14, thug.y - 20, 28 * (thug.hp / 100), 4);
    }
    for (const cop of state.cops) {
      if (cop.down) {
        ctx.save();
        ctx.translate(cop.x, cop.y);
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(-10, -4, 20, 8);
        ctx.restore();
        continue;
      }
      drawPerson(ctx, cop.x, cop.y, cop.angle, '#1a1a2e', { cop: true });
    }
    for (const car of state.cars) drawCar(ctx, car);
    ctx.fillStyle = '#ffe14d';
    for (const b of state.bullets) {
      ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI * 2); ctx.fill();
    }
    for (const pt of state.particles) {
      ctx.globalAlpha = Math.max(0, pt.life * 2);
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
    }
    ctx.globalAlpha = 1;

    const p = state.player;
    if (!p.car) {
      drawPerson(ctx, p.x, p.y, p.angle, '#ffcc00');
      ctx.fillStyle = '#111111';
      ctx.fillRect(p.x + Math.cos(p.angle) * 8 - 2, p.y + Math.sin(p.angle) * 8 - 2, 4, 4);
    } else {
      ctx.strokeStyle = '#ffcc00';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(p.car.x, p.car.y, p.car.len * 0.75, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
    return { ox, oy };
  }

  function worldMarker(state) {
    const p = state.city.places;
    const i = state.missionIndex;
    if (i === 0) return state.missionStage === 0 ? p.carMeet : p.garage;
    if (i === 1) return p.docks;
    if (i === 2) return state.missionStage === 0 ? p.bank : state.missionStage === 1 ? p.bank : p.hideout;
    return p.hideout;
  }

  function drawMinimap(state) {
    const size = viewW < 560 ? 110 : 190;
    const x0 = viewW - size - 14;
    const y0 = 14;
    const scale = size / WORLD_W;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    roundRect(ctx, x0 - 4, y0 - 4, size + 8, size * (WORLD_H / WORLD_W) + 8, 8);
    ctx.fill();
    const h = size * (WORLD_H / WORLD_W);
    ctx.fillStyle = '#274d2a';
    ctx.fillRect(x0, y0, size, h);
    ctx.fillStyle = '#55555e';
    for (const rx of state.city.vRoads) ctx.fillRect(x0 + rx * scale - 1, y0, 2, h);
    for (const ry of state.city.hRoads) ctx.fillRect(x0, y0 + ry * scale, size, 2);
    if (state.missionIndex < MISSIONS.length) {
      const t = worldMarker(state);
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(x0 + t.x * scale, y0 + t.y * scale, 5, 0, Math.PI * 2);
      ctx.fill();
    }
    for (const car of state.cars) {
      ctx.fillStyle = car.type === 'police' ? '#4488ff' : '#dddddd';
      ctx.fillRect(x0 + car.x * scale - 1.5, y0 + car.y * scale - 1.5, 3, 3);
    }
    for (const cop of state.cops) {
      if (cop.down) continue;
      ctx.fillStyle = '#4488ff';
      ctx.fillRect(x0 + cop.x * scale - 1.5, y0 + cop.y * scale - 1.5, 3, 3);
    }
    const p = state.player;
    ctx.fillStyle = '#ffcc00';
    ctx.beginPath();
    ctx.arc(x0 + p.x * scale, y0 + p.y * scale, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#111111';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('N ↑', x0, y0 + h + 16);
    ctx.restore();
  }

  function drawHud(state, objective) {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    roundRect(ctx, 12, 12, 250, 108, 10);
    ctx.fill();
    ctx.textAlign = 'left';
    ctx.fillStyle = '#2ecc71';
    ctx.font = 'bold 24px sans-serif';
    ctx.fillText(`$${state.money}`, 26, 42);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 15px sans-serif';
    ctx.fillText(formatClock(state.clock), 180, 40);
    ctx.fillStyle = '#333333';
    ctx.fillRect(26, 52, 150, 12);
    ctx.fillStyle = state.health > 40 ? '#2ecc71' : '#e74c3c';
    ctx.fillRect(26, 52, 150 * (state.health / 100), 12);
    ctx.fillStyle = '#ffffff';
    ctx.font = '12px sans-serif';
    ctx.fillText(`${L('HP', '生命')} ${Math.ceil(state.health)}`, 182, 62);
    ctx.font = '20px sans-serif';
    let stars = '';
    for (let i = 0; i < 5; i += 1) stars += i < state.wanted ? '★' : '☆';
    ctx.fillStyle = state.wanted > 0 ? '#ff4444' : '#888888';
    ctx.fillText(stars, 26, 92);
    ctx.fillStyle = '#ffffff';
    ctx.font = '13px sans-serif';
    const carNames = { sedan: '轿车', taxi: '出租车', truck: '卡车', sport: '跑车', police: '警车' };
    ctx.fillText(state.player.car
      ? (LANG === 'zh' ? `🚗 ${carNames[state.player.car.type] || state.player.car.type} — 按 E 下车` : `🚗 ${state.player.car.type.toUpperCase()} — E to exit`)
      : (LANG === 'zh' ? `🔫 子弹 ${state.ammo} / 12 — 按 F / 点击射击` : `🔫 Ammo ${state.ammo} / 12 — F / click to shoot`), 26, 110);
    const objText = state.missionIndex < MISSIONS.length
      ? (LANG === 'zh' ? `任务 ${state.missionIndex + 1}：${MISSIONS[state.missionIndex].name} —— ${objective}` : `Mission ${state.missionIndex + 1}: ${MISSIONS[state.missionIndex].name} — ${objective}`)
      : objective;
    ctx.font = 'bold 16px sans-serif';
    fitFont(objText, 'bold', 16, viewW - 44);
    const w = Math.min(ctx.measureText(objText).width + 28, viewW - 12);
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    roundRect(ctx, (viewW - w) / 2, viewH - 86, w, 34, 8);
    ctx.fill();
    ctx.fillStyle = '#ffd700';
    ctx.textAlign = 'center';
    ctx.fillText(objText, viewW / 2, viewH - 63);
    if (state.messageTimer > 0 && state.message) {
      ctx.font = 'bold 17px sans-serif';
      fitFont(state.message, 'bold', 17, viewW - 44);
      const mw = Math.min(ctx.measureText(state.message).width + 28, viewW - 12);
      // On narrow screens raise the message above the touch-button rows.
      const msgTop = viewW < 560 ? viewH - 196 : viewH - 132;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      roundRect(ctx, (viewW - mw) / 2, msgTop, mw, 32, 8);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.fillText(state.message, viewW / 2, msgTop + 22);
    }
    ctx.restore();
    drawMinimap(state);
  }

  function drawTitle(state, best) {
    drawWorld(state, 0);
    ctx.fillStyle = 'rgba(10,10,26,0.72)';
    ctx.fillRect(0, 0, viewW, viewH);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd700';
    const titleText = L('PORT SOLANO', '索拉诺港');
    fitFont(titleText, 'bold', 64, viewW - 16);
    ctx.fillText(titleText, viewW / 2, viewH * 0.3);
    ctx.fillStyle = '#ffffff';
    const subText = L('An open-world crime story — steal, drive, run, survive.', '开放世界犯罪故事——偷车、飙车、逃亡、活下去。');
    fitFont(subText, 'bold', 26, viewW - 16);
    ctx.fillText(subText, viewW / 2, viewH * 0.3 + 44);
    ctx.fillStyle = '#dddddd';
    const lines = LANG === 'zh' ? [
      '跟着金色 ◆ 标记走，就是任务地点。小地图右上角也能看到。',
      '电脑：WASD / 方向键移动和开车 • E 上车/下车 • F 或点击射击',
      '空格拳击 • R 换弹 • P / Esc 暂停 • M 静音',
      '手机：左下方向键移动，右下按钮上车、拳击、射击；点屏幕也能开枪。',
      '共 3 个主线任务。犯事会涨通缉星，警察会来抓你——甩掉他们！',
      '没血了找白色十字补血，没子弹了找绿盒子补弹药。',
    ] : [
      'Follow the gold ◆ marker — that is your mission target. It is on the minimap too.',
      'PC: WASD / arrows — move & drive  •  E — enter / exit car  •  F or click — shoot',
      'Space — punch  •  R — reload  •  P / Esc — pause  •  M — mute',
      'Touch: left pad to move, right buttons to act — tap the city to shoot that way.',
      'Three story missions. Crimes raise your wanted stars — lose the cops!',
      'Low on health? Find a white cross. Out of ammo? Find a green box.',
    ];
    lines.forEach((line, i) => { fitFont(line, '', 16, viewW - 16); ctx.fillText(line, viewW / 2, viewH * 0.44 + i * 24); });
    ctx.fillStyle = '#ffcc00';
    const playText = L('▶  CLICK or press ENTER to play', '▶  点击屏幕或按回车开始游戏');
    fitFont(playText, 'bold', 22, viewW - 16);
    ctx.fillText(playText, viewW / 2, viewH * 0.68);
    if (best.hasSave) {
      ctx.fillStyle = '#7ee787';
      const saveText = L('💾  Saved game found — press C to continue', '💾  发现存档——按 C 继续游戏');
      fitFont(saveText, 'bold', 18, viewW - 16);
      ctx.fillText(saveText, viewW / 2, viewH * 0.68 + 32);
    }
    ctx.fillStyle = '#aaaaaa';
    const fy = viewH * (viewW < 560 ? 0.80 : 0.84);
    const footText = L('A wholly original game.', '一款完全原创的小游戏。');
    fitFont(footText, '', 14, viewW - 16);
    ctx.fillText(footText, viewW / 2, fy);
    const bestLine = LANG === 'zh' ? '最佳成绩：$' + best.money + '  •  已完成任务：' + best.missions + ' 个' : 'Best run: $' + best.money + '  •  Missions done: ' + best.missions;
    fitFont(bestLine, '', 14, viewW - 16);
    ctx.fillText(bestLine, viewW / 2, fy + 24);
    ctx.restore();
  }

  function drawPaused(state) {
    drawWorld(state, 0);
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, viewW, viewH);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 44px sans-serif';
    ctx.fillText(L('PAUSED', '已暂停'), viewW / 2, viewH * 0.38);
    ctx.fillStyle = '#dddddd';
    const pauseLine = L('P / Esc — resume    •    S — save game    •    Click SAVE below', 'P / Esc —— 继续    •    S —— 保存游戏    •    点击下方保存');
    fitFont(pauseLine, '', 18, viewW - 16);
    ctx.fillText(pauseLine, viewW / 2, viewH * 0.38 + 40);
    ctx.fillStyle = '#ffcc00';
    ctx.font = 'bold 20px sans-serif';
    ctx.fillText(L('[ SAVE GAME ]', '[ 保存游戏 ]'), viewW / 2, viewH * 0.52);
    ctx.fillStyle = '#ffffff';
    const pauseNote = L('Progress is also saved automatically when a mission is completed.', '完成任务时也会自动保存进度。点任意处或按暂停键继续。');
    fitFont(pauseNote, '', 16, viewW - 16);
    ctx.fillText(pauseNote, viewW / 2, viewH * 0.52 + 30);
    ctx.restore();
  }

  function drawOver(state) {
    drawWorld(state, 0);
    ctx.fillStyle = 'rgba(20,0,0,0.7)';
    ctx.fillRect(0, 0, viewW, viewH);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = state.over === 'busted' ? '#4488ff' : '#ff4444';
    ctx.font = 'bold 60px sans-serif';
    ctx.fillText(state.over === 'busted' ? L('BUSTED!', '被抓了！') : L('WASTED!', '你挂了！'), viewW / 2, viewH * 0.4);
    ctx.fillStyle = '#ffffff';
    const overLine = state.over === 'busted'
      ? L('The Solano PD hauled you in. The story starts over.', '你被索拉诺警察抓走了。故事重新开始。')
      : L('Port Solano got the better of you this time.', '这次索拉诺港把你打败了。');
    fitFont(overLine, '', 20, viewW - 16);
    ctx.fillText(overLine, viewW / 2, viewH * 0.4 + 40);
    ctx.fillStyle = '#ffd700';
    const statsLine = LANG === 'zh' ? `金钱：$${state.money}   •   完成任务：${state.stats.missionsDone} 个   •   偷车：${state.stats.stolen} 辆` : `Money: $${state.money}   •   Missions done: ${state.stats.missionsDone}   •   Cars stolen: ${state.stats.stolen}`;
    fitFont(statsLine, 'bold', 18, viewW - 16);
    ctx.fillText(statsLine, viewW / 2, viewH * 0.4 + 80);
    ctx.fillStyle = '#ffffff';
    const retryText = L('▶  CLICK or press ENTER to try again', '▶  点击或按回车再来一局');
    fitFont(retryText, 'bold', 18, viewW - 16);
    ctx.fillText(retryText, viewW / 2, viewH * 0.58);
    ctx.restore();
  }

  function rclamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // Shrink a font until `text` fits maxW, so overlay screens stay readable
  // on narrow phone viewports. Returns the pixel size chosen.
  function fitFont(text, weight, basePx, maxW) {
    let px = basePx;
    const set = () => { ctx.font = (weight ? weight + ' ' : '') + px + 'px sans-serif'; };
    set();
    while (px > 9 && ctx.measureText(text).width > maxW) { px -= 1; set(); }
    return px;
  }

  return {
    get width() { return viewW; },
    get height() { return viewH; },
    resize,
    draw(state, screen, objective, best) {
      const now = performance.now();
      if (screen === SCREEN_TITLE) { drawTitle(state, best); return; }
      if (screen === SCREEN_OVER) { drawOver(state); return; }
      if (screen === SCREEN_PAUSED) { drawPaused(state); return; }
      drawWorld(state, now);
      drawHud(state, objective);
    },
  };
}

// ---------- main.js ----------
const MAX_FRAME = 0.25;

const seed = Math.floor(Math.random() * 4294967296);

const canvas = document.getElementById('game');
const status = document.getElementById('status');
const audio = createAudio();
const world = createWorld(createRandom(seed), audio);
const renderer = createRenderer(canvas);

function readBest() {
  if (!savedGameJson) return { hasSave: false, money: 0, missions: 0 };
  try {
    const data = JSON.parse(savedGameJson);
    return { hasSave: true, money: data.money || 0, missions: data.missionIndex || 0 };
  } catch {
    return { hasSave: false, money: 0, missions: 0 };
  }
}

function runGame() {
  const input = createInput(canvas);
  let screen = SCREEN_TITLE;
  let best = readBest();
  let savedMissions = 0;
  let accumulator = 0;
  let last = performance.now();

  function announce(message) {
    status.textContent = message;
  }

  function startGame() {
    world.reset();
    savedMissions = 0;
    accumulator = 0;
    screen = SCREEN_PLAY;
    audio.unlock();
    announce(L('Playing. Steal a car with E, follow the gold marker.', '游戏开始。按 E 偷车，跟着金色标记走。'));
  }

  function endGame() {
    screen = SCREEN_OVER;
    announce(world.state.over === 'busted' ? L('Busted by the Solano PD.', '被索拉诺警察抓住了。') : L('Wasted. Port Solano got you.', '你挂了。'));
  }

  function mouseWorld() {
    const cam = world.state.camera;
    const vx = Math.max(0, Math.min(cam.x - renderer.width / 2, 3200 - renderer.width));
    const vy = Math.max(0, Math.min(cam.y - renderer.height / 2, 2400 - renderer.height));
    const ox = renderer.width > 3200 ? (renderer.width - 3200) / 2 : -vx;
    const oy = renderer.height > 2400 ? (renderer.height - 2400) / 2 : -vy;
    return { x: input.mouse.x - ox, y: input.mouse.y - oy };
  }

  // Aim the next shot straight ahead of the player (used by the touch
  // SHOOT button, where there is no mouse position to aim with).
  function aimAhead() {
    const cam = world.state.camera;
    const vx = Math.max(0, Math.min(cam.x - renderer.width / 2, 3200 - renderer.width));
    const vy = Math.max(0, Math.min(cam.y - renderer.height / 2, 2400 - renderer.height));
    const ox = renderer.width > 3200 ? (renderer.width - 3200) / 2 : -vx;
    const oy = renderer.height > 2400 ? (renderer.height - 2400) / 2 : -vy;
    const p = world.state.player;
    input.mouse.x = p.x + Math.cos(p.angle) * 160 + ox;
    input.mouse.y = p.y + Math.sin(p.angle) * 160 + oy;
  }

  // ---- On-screen touch buttons ----
  if ('ontouchstart' in window || navigator.maxTouchPoints > 0) document.body.classList.add('touch');
  function bindHold(id, on, off) {
    const el = document.getElementById(id);
    if (!el) return;
    const start = (e) => { e.preventDefault(); el.classList.add('held'); on(); };
    const end = (e) => { if (e) e.preventDefault(); el.classList.remove('held'); if (off) off(); };
    el.addEventListener('pointerdown', start);
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', () => end(null));
    el.addEventListener('pointerleave', () => { if (el.classList.contains('held')) end(null); });
    el.addEventListener('contextmenu', (e) => e.preventDefault());
  }
  bindHold('btn-up', () => input.touchDir('up', true), () => input.touchDir('up', false));
  bindHold('btn-down', () => input.touchDir('down', true), () => input.touchDir('down', false));
  bindHold('btn-left', () => input.touchDir('left', true), () => input.touchDir('left', false));
  bindHold('btn-right', () => input.touchDir('right', true), () => input.touchDir('right', false));
  bindHold('btn-punch', () => input.touchDir('punch', true), () => input.touchDir('punch', false));
  bindHold('btn-enter', () => input.pressAction(ACTION_ENTER_CAR | ACTION_CONFIRM));
  bindHold('btn-reload', () => input.pressAction(ACTION_RELOAD));
  bindHold('btn-pause', () => input.pressAction(ACTION_PAUSE));
  bindHold('btn-shoot', () => { aimAhead(); input.pressAction(ACTION_SHOOT | ACTION_CONFIRM); });

  // ---- Language toggle: EN (default) / 中文 — switches every label ----
  const langBtn = document.getElementById('btn-lang');
  function syncLangUI() {
    const zh = LANG === 'zh';
    document.documentElement.lang = zh ? 'zh-CN' : 'en';
    if (langBtn) {
      langBtn.innerHTML = zh ? '<span style="opacity:.55">EN</span>&nbsp;/&nbsp;<b>中文</b>' : '<b>EN</b>&nbsp;/&nbsp;<span style="opacity:.55">中文</span>';
      langBtn.setAttribute('aria-label', zh ? 'Switch to English' : '切换到中文');
    }
    const punchBtn = document.getElementById('btn-punch');
    if (punchBtn) { punchBtn.textContent = zh ? '拳' : 'Hit'; punchBtn.setAttribute('aria-label', zh ? '拳击' : 'Punch'); }
    const shootBtn = document.getElementById('btn-shoot');
    if (shootBtn) { shootBtn.textContent = zh ? '射击' : 'Shoot'; shootBtn.setAttribute('aria-label', zh ? '射击' : 'Shoot'); }
    const pauseBtn = document.getElementById('btn-pause');
    if (pauseBtn) { pauseBtn.textContent = zh ? '❚❚ 暂停' : '❚❚ Pause'; pauseBtn.setAttribute('aria-label', zh ? '暂停' : 'Pause'); }
    const reloadBtn = document.getElementById('btn-reload');
    if (reloadBtn) reloadBtn.setAttribute('aria-label', zh ? '换弹匣' : 'Reload');
    const enterBtn = document.getElementById('btn-enter');
    if (enterBtn) enterBtn.setAttribute('aria-label', zh ? '上车 / 下车' : 'Enter / exit car');
    canvas.setAttribute('aria-label', zh
      ? '索拉诺港：俯视开放世界犯罪游戏。开车、偷车、躲警察，完成三个剧情任务。'
      : 'Port Solano: a top-down open-world crime game. Drive, steal cars, dodge the police, finish three story missions.');
  }
  if (langBtn) {
    langBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      LANG = LANG === 'zh' ? 'en' : 'zh';
      MISSIONS = LANG === 'zh' ? MISSIONS_ZH : MISSIONS_EN;
      audio.unlock();
      audio.click();
      syncLangUI();
      announce(L('Language: English', '语言：中文'));
    });
  }
  syncLangUI();

  function frame(now) {
    requestAnimationFrame(frame);
    accumulator += Math.min((now - last) / 1000, MAX_FRAME);
    last = now;

    const actions = input.takeActions();
    const click = input.takeClick();
    if (actions & ACTION_MUTE) {
      const muted = audio.toggleMute();
      announce(muted ? L('Sound off.', '声音已关。') : L('Sound on.', '声音已开。'));
    }

    if (screen === SCREEN_TITLE) {
      if (actions & ACTION_CONFIRM || click) {
        audio.unlock();
        audio.click();
        startGame();
      } else if (input.held('c') && best.hasSave && world.load()) {
        audio.unlock();
        screen = SCREEN_PLAY;
        savedMissions = world.state.stats.missionsDone;
        announce(L('Save loaded. Welcome back to Port Solano.', '存档已读取。欢迎回到索拉诺港。'));
      }
      while (accumulator >= STEP && screen === SCREEN_TITLE) {
        world.step(STEP, { steer: 0, throttle: 0, punch: false }, 0, { x: 0, y: 0 });
        accumulator -= STEP;
      }
    } else if (screen === SCREEN_PLAY) {
      if (actions & ACTION_PAUSE) {
        screen = SCREEN_PAUSED;
        announce(L('Paused.', '已暂停。'));
        accumulator = 0;
      } else {
        let firstStep = true;
        while (accumulator >= STEP && screen === SCREEN_PLAY) {
          const stepActions = firstStep ? actions : 0;
          firstStep = false;
          const ev = world.step(STEP, input.drive(), stepActions, mouseWorld());
          if (ev & (EVENT_WASTED | EVENT_BUSTED)) endGame();
          accumulator -= STEP;
        }
        if (world.state.stats.missionsDone > savedMissions) {
          savedMissions = world.state.stats.missionsDone;
          world.save();
          best = readBest();
        }
      }
    } else if (screen === SCREEN_PAUSED) {
      if (actions & ACTION_PAUSE) {
        screen = SCREEN_PLAY;
        announce(L('Playing.', '继续游戏。'));
      } else if (input.held('s') || input.held('S')) {
        if (world.save()) { announce(L('Game saved.', '游戏已保存。')); best = readBest(); }
      } else if (click && Math.abs(click.y - renderer.height * 0.52) < 24 && Math.abs(click.x - renderer.width / 2) < 110) {
        if (world.save()) { announce(L('Game saved.', '游戏已保存。')); best = readBest(); }
      } else if (actions & ACTION_CONFIRM || click) {
        screen = SCREEN_PLAY;
      }
      accumulator = 0;
    } else if (screen === SCREEN_OVER) {
      if (actions & ACTION_CONFIRM || click) {
        audio.click();
        startGame();
      }
      accumulator = 0;
    }

    renderer.draw(world.state, screen, world.missionObjective(), best);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && screen === SCREEN_PLAY) {
      screen = SCREEN_PAUSED;
      announce(L('Paused.', '已暂停。'));
    }
  });

  announce(L('Port Solano. Press Enter or click to start.', '索拉诺港。按回车或点击开始。'));
  requestAnimationFrame(frame);
}

runGame();
</script>
